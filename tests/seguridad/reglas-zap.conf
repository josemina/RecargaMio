# Reglas de ZAP para el escaneo de la API de RecargaMIO (T8, ADR 0016).
# Formato: id<TAB>IGNORE|INFO|WARN|FAIL<TAB>(nombre) justificación. Una regla que no aparece queda en WARN.
# No se esconde nada: las reglas de aquí siguen apareciendo en el reporte, y «npm run metricas» muestra su justificación.
# Corregidos en T8 (ya no deberían aparecer): 10098 CORS abierto, 10055 CSP con comodín y unsafe-inline,
# 10063 Permissions-Policy y 90004 aislamiento contra Spectre.
10202	INFO	(Absence of Anti-CSRF Tokens) Falso positivo. El formulario de /restablecer lleva el token de recuperación: secreto, de un solo uso, de 30 minutos y ligado a la cuenta. Un sitio ajeno no lo conoce y la ruta no usa cookies de sesión, así que no hay CSRF posible.
100001	INFO	(Unexpected Content-Type was returned) Esperado. /restablecer y /pasarela-simulada/* son páginas HTML por diseño y el contrato OpenAPI las declara como text/html.
10116	INFO	(ZAP is Out of Date) Aceptado. La imagen de ZAP tiene versión fija para que las corridas se puedan repetir; se actualiza a propósito, no en cada corrida.
10024	INFO	(Information Disclosure - Sensitive Information in URL) Aceptado. El enlace del correo de recuperación lleva el token en la URL, como todo enlace de recuperación. Mitigación: un solo uso, 30 minutos, Referrer-Policy no-referrer y el token se oculta en los registros.
100000	INFO	(A Client Error response code was returned by the server) Esperado. ZAP envía datos inválidos a propósito y la API responde 400, 401, 404 o 422 como dice el contrato.
10049	INFO	(Non-Storable Content) Esperado. Las respuestas con datos personales no deben guardarse en caché.
10104	INFO	(User Agent Fuzzer) Esperado. ZAP repite peticiones con distintos User-Agent y la API responde igual a todos: no cambia su comportamiento según el navegador.
